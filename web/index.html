<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Studio - 主题编辑器</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="stylesheet" href="/src/templates/theme-variables.css">
    <link rel="stylesheet" href="/src/tailwind.css">
</head>
<body>
    <!-- Removed homePage - app goes directly to workspace -->

    <div id="workspaceView">
        <div class="app-container">
            <!-- Column 1: Project Sidebar (collapsible) -->
            <aside class="project-sidebar" id="projectSidebar">
                <button class="landing-sidebar-toggle ui-icon-button" id="landingSidebarToggleBtn" title="展开项目列表">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="7 9 3 12 7 15"/>
                        <line x1="9" y1="7" x2="21" y2="7"/>
                        <line x1="9" y1="12" x2="21" y2="12"/>
                        <line x1="9" y1="17" x2="21" y2="17"/>
                    </svg>
                </button>
                <div class="sidebar-brand-header">
                    <div class="sidebar-brand-info">
                        <div class="sidebar-brand-title">主题AI助手</div>
                    </div>
                    <button class="sidebar-brand-collapse-btn ui-icon-button" id="sidebarBrandCollapseBtn" title="收起侧栏">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-new-btn" id="newProjectBtn">
                    <svg class="sidebar-new-btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
                    </svg>
                    <span>新建项目</span>
                </div>
                <div class="sidebar-project-list" id="sidebarProjectList">
                    <!-- JS fills this -->
                </div>
                <div class="sidebar-bottom-row">
                    <button class="sidebar-settings-btn ui-icon-button ui-icon-button-inline" id="sidebarSettingsBtn" title="打开设置">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.64 0 1.22.26 1.64.68.42.42.68 1 .68 1.64s-.26 1.22-.68 1.64c-.42.42-1 .68-1.64.68h-.09A1.65 1.65 0 0 0 19.4 15z"></path>
                        </svg>
                        <span>设置</span>
                    </button>
                    <div id="creditsBar" class="credits-bar" style="display: none;">
                        <span id="creditsText" class="credits-text">⚡ --</span>
                    </div>
                </div>
            </aside>
            <div class="pane-divider pane-divider-sidebar" id="sidebarDivider" aria-hidden="true"></div>

            <!-- Column 2: Chat Panel -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <div class="brand-header">
                        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="展开/收起项目列表">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="7 9 3 12 7 15"/>
                                <line x1="9" y1="7" x2="21" y2="7"/>
                                <line x1="9" y1="12" x2="21" y2="12"/>
                                <line x1="9" y1="17" x2="21" y2="17"/>
                            </svg>
                        </button>
                        <span class="chat-project-name" id="chatProjectName">开始新创作</span>
                    </div>
                    <button id="projectActionBtn" class="settings-btn" title="项目操作">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
                        </svg>
                    </button>
                    <div class="project-action-menu" id="projectActionMenu">
                        <button id="actionRename" class="plus-menu-item">重命名</button>
                        <button id="actionPin" class="plus-menu-item">置顶</button>
                        <button id="actionDelete" class="plus-menu-item">删除</button>
                    </div>
                    <div class="landing-topbar">
                        <div class="landing-brand">
                            <div class="landing-brand-lockup">
                                <img class="landing-brand-logo-image" src="/branding/landray-logo.png" alt="Landray 蓝凌" loading="eager">
                                <span class="landing-brand-divider"></span>
                                <span class="landing-brand-copy">标准产品主题包 AI 生成工具</span>
                            </div>
                        </div>
                        <button id="landingCreditsChip" class="landing-credits-chip" type="button" title="当前积分" style="display: none;">
                            <span>积分</span>
                            <span id="landingCreditsText">120</span>
                            <span class="landing-credits-spark" aria-hidden="true">✦</span>
                        </button>
                    </div>
                </div>
                
                <div class="chat-default-view" id="chatDefaultView">
                    <div class="chat-default-scroll">
                        <section class="landing-shell" id="chatLandingHero">
                            <div class="landing-hero landing-hero--compact">
                                <div class="landing-hero-copy landing-hero-copy--centered">
                                    <h1 class="landing-hero-title">一句话，生成<span class="landing-hero-highlight">可上线</span>主题包</h1>
                                    <p class="landing-hero-subtitle">告别繁琐代码配置，通过自然语言即刻定制 OA 专属皮肤</p>
                                </div>
                            </div>

                            <div class="input-area input-area--landing">
                                <div class="image-preview-bar" id="imagePreviewBar"></div>
                                <div class="input-row chat-shell-composer">
                                    <div class="chat-input-wrapper chat-shell-composer-inner chat-shell-composer-inner--landing">
                                        <textarea id="messageInput" rows="1" placeholder="描述你要生成的主题包（场景 + 风格 + 色调）例如： 企业年会｜科技蓝｜门户主题包"></textarea>
                                        <div class="chat-shell-toolbar">
                                            <button id="plusBtn" class="plus-btn ui-icon-button chat-shell-plus" title="添加图片">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                                </svg>
                                            </button>
                                            <span class="chat-cost-hint" style="display: none;">⚡25</span>
                                            <button id="sendBtn" class="ui-icon-button chat-shell-send" title="发送">
                                                <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M12 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                    <path d="M5 12L12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                                <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <section class="landing-section landing-section--after-composer" aria-labelledby="landingStartTitle">
                                <div class="landing-starter-pills theme-suggestions">
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="想做一套有新年氛围的主题皮肤，整体轻盈喜庆，适合门户首页和工作台展示。">
                                        想做一套有新年氛围的主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="做一套春节主题皮肤，要有节日感和热闹气氛，适合标准产品首页展示。">
                                        做一套春节主题皮肤，要有节日感和热闹气氛
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="来一套清新一点的春日主题皮肤，偏浅色，带一点科技感。">
                                        来一套清新一点的春日主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="想做一套中秋主题皮肤，氛围温暖、东方、适合门户首页。">
                                        想做一套中秋主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="做一套科技蓝主题皮肤，适合标准产品门户首页，整体简洁、明亮、有数字化氛围。">
                                        做一套科技蓝主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="想做一套企业年会主题皮肤，主视觉热烈大气，适合活动门户和工作台。">
                                        想做一套企业年会主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="来一套绿色低碳主题皮肤，偏环保科技风，适合展示平台首页。">
                                        来一套绿色低碳主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="做一套实验室主题皮肤，整体要干净、专业、带一点未来感。">
                                        做一套实验室主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="想做一套国庆主题皮肤，氛围庄重大气，适合门户首页展示。">
                                        想做一套国庆主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="来一套协同办公主题皮肤，空间感强，适合企业办公平台。">
                                        来一套协同办公主题皮肤
                                    </button>
                                </div>
                            </section>
                        </section>

                        <div class="messages-container messages-container--landing">
                            <section class="landing-section landing-section--gallery" aria-labelledby="landingInspirationTitle">
                                <div class="landing-section-header landing-section-header--stacked">
                                    <h3 class="landing-section-title" id="landingInspirationTitle">主图推荐</h3>
                                </div>
                                <div class="landing-gallery-grid">
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/Mid-AutumnFestival-01.png" data-theme-name="中秋" aria-label="用中秋主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/Mid-AutumnFestival-01.png" alt="中秋主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/Cooperation-02.png" data-theme-name="协作办公" aria-label="用协作办公主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/Cooperation-02.png" alt="企业主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/Technology-03.png" data-theme-name="科技蓝" aria-label="用科技蓝主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/Technology-03.png" alt="科技蓝主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/Industry-04.png" data-theme-name="智能工厂" aria-label="用智能工厂主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/Industry-04.png" alt="科技工厂主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/WorkCabin-05.png" data-theme-name="工作舱" aria-label="用工作舱主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/WorkCabin-05.png" alt="办公工作台主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/EnvironmentalProtection-06.png" data-theme-name="环保科技" aria-label="用环保科技主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/EnvironmentalProtection-06.png" alt="环保科技主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/GreenChemistry-07.png" data-theme-name="绿色化学" aria-label="用绿色化学主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/GreenChemistry-07.png" alt="绿色化学主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/GreenIndustry-08.png" data-theme-name="绿色工业" aria-label="用绿色工业主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/GreenIndustry-08.png" alt="绿色工业主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/AdvancedTechnology-09.png" data-theme-name="先进科技" aria-label="用先进科技主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/AdvancedTechnology-09.png" alt="先进科技主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/NationalDay-10.png" data-theme-name="国庆" aria-label="用国庆主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/NationalDay-10.png" alt="国庆主题效果图" loading="lazy">
                                    </article>
                                </div>
                            </section>
                            <div class="landing-page-footer" aria-label="功能说明">
                                AI 智能生成 ｜ 遵循蓝凌设计规范 ｜ 蓝凌标准主题包结构 ｜ 一键打包上线
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chat-conversation-view is-hidden" id="chatConversationView">
                    <div class="messages-container" id="messagesContainer"></div>

                    <div class="input-area">
                        <div class="image-preview-bar" id="conversationImagePreviewBar"></div>
                        <div class="input-row chat-shell-composer">
                            <div class="chat-input-wrapper chat-shell-composer-inner">
                                <textarea id="conversationMessageInput" rows="1" placeholder="描述您需要的活动/节日主题..."></textarea>
                                <button id="conversationPlusBtn" class="plus-btn ui-icon-button chat-shell-plus" title="添加图片">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </button>
                                <span class="chat-cost-hint" style="display: none;">⚡25</span>
                                <button id="conversationSendBtn" class="ui-icon-button chat-shell-send" title="发送">
                                    <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M5 12L12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pane-divider pane-divider-preview" id="previewDivider" aria-hidden="true"></div>

            <!-- Column 3: Preview Panel (hidden by default, expands after AI generates theme) -->
            <div class="preview-panel" id="previewPanel">
                <!-- Close button -->
                <button class="preview-close-btn" id="previewCloseBtn" title="关闭预览">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <!-- Workspace Top Bar -->
                <div class="workspace-topbar">
                    <div class="topbar-left">
                        <span class="project-name" id="projectName">未命名项目</span>
                        <div class="topbar-tabs">
                            <div class="tab-indicator"></div>
                            <button id="loginTab" class="tab-btn active-tab">登录页</button>
                            <button id="mainPageTab" class="tab-btn">主页</button>
                        </div>
                    </div>
                    <div class="topbar-right">
                        <button class="topbar-action-btn" id="panelToggleBtn">面板</button>
                        <button class="topbar-action-btn" id="packageBtn">打包</button>
                    </div>
                </div>
                
                <div class="preview-content">
                    <div id="loginPage" class="preview-page active-preview">
                    </div>
                    
                    <div id="mainPage" class="preview-page">
                    </div>
                </div>
            </div> <!-- end preview-panel -->

        </div> <!-- end app-container -->

        <!-- 右侧滑出面板 -->
        <div class="side-panel" id="sidePanel">
            <div class="side-panel-header">
                <h3>颜色配置</h3>
                <button class="side-panel-close" id="sidePanelClose">&times;</button>
            </div>
            <div class="side-panel-body" id="colorEditor"></div>
            
            <!-- 质检报告区域 -->
            <div class="qc-section" id="qcSection">
                <h3 class="qc-title">质检报告</h3>
                <button class="qc-run-btn" id="qcRunBtn">运行检查</button>
                <div id="qcResults" class="qc-results"></div>
            </div>
        </div>

        <!-- 打包选择弹窗 -->
        <div class="modal-overlay" id="packageModal">
            <div class="modal-content package-modal">
                <header class="package-modal-header">
                    <div>
                        <h2 class="package-modal-title">主题打包</h2>
                        <p class="package-modal-subtitle">选择需要打包的产品并执行打包任务</p>
                    </div>
                    <button class="package-modal-close-btn" id="packageModalClose" aria-label="关闭">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </header>
                <div class="package-modal-body">
                    <section class="package-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>产品选择</h3>
                        </div>
                        <div class="package-actions">
                            <button id="packageSelectAll">全选</button>
                            <button id="packageDeselectAll">取消全选</button>
                        </div>
                        <div id="packageProductList" class="package-product-list"></div>
                    </section>
                </div>
                <footer class="package-modal-footer">
                    <button id="packageStartBtn" class="btn-primary">开始打包</button>
                    <button id="packageCancelBtn" class="btn-secondary">取消</button>
                </footer>
            </div>
        </div>

        <!-- 打包进度弹窗（独立） -->
        <div class="modal-overlay" id="packageProgressModal">
            <div class="modal-content package-progress-modal">
                <button class="package-progress-close" id="packageProgressClose" aria-label="关闭">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <div id="packageProgressContent" class="package-progress-content"></div>
            </div>
        </div>

        <!-- 设置模态框 -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content settings-modal">
                <!-- Header -->
                <header class="settings-header">
                    <div>
                        <h2 class="settings-title">API设置</h2>
                        <p class="settings-subtitle">配置您的工作区 API 凭据和环境参数</p>
                    </div>

        <script>
          function resizePreview() {
            var containers = document.querySelectorAll('.preview-content');
            containers.forEach(function(container) {
              var cw = container.clientWidth;
              var ch = container.clientHeight;
              if (cw === 0 || ch === 0) return;

              var activePage = container.querySelector('.preview-page.active-preview');
              if (!activePage) activePage = container.querySelector('.preview-page');
              if (!activePage) return;

              var rendered = activePage.firstElementChild;
              if (!rendered) return;

              var rw = rendered.offsetWidth || parseInt(rendered.style.width) || 0;
              var rh = rendered.offsetHeight || parseInt(rendered.style.height) || 0;
              if (rw === 0 || rh === 0) return;

              var scaleX = cw / rw;
              var scaleY = ch / rh;
              var scale = Math.max(scaleX, scaleY);

              var offsetX = (cw - rw * scale) / 2;
              var offsetY = (ch - rh * scale) / 2;

              rendered.style.transform = 'scale(' + scale + ') translate(' + (offsetX / scale) + 'px, ' + (offsetY / scale) + 'px)';
              rendered.style.transformOrigin = 'top left';
            });
          }

          window.addEventListener('resize', resizePreview);
          window.resizePreview = resizePreview;
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(resizePreview, 200);
            setTimeout(resizePreview, 1000);
            document.querySelectorAll('.preview-tabs button').forEach(function(btn) {
              btn.addEventListener('click', function() { setTimeout(resizePreview, 100); });
            });
          });
        </script>

        <script type="module" src="/src/main.ts"></script>
