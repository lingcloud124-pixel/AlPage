<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Studio - 主题编辑器</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="stylesheet" href="/src/templates/theme-variables.css">
    <link rel="stylesheet" href="/src/tailwind.css">
</head>
<body>
    <!-- Removed homePage - app goes directly to workspace -->

    <div id="workspaceView">
        <div class="app-container">
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <div class="brand-header">
                        <span class="chat-project-name" id="chatProjectName">开始新创作</span>
                    </div>
                    <div class="landing-topbar">
                        <button id="landingHomeBtn" class="landing-brand" type="button" title="返回首页" aria-label="返回首页">

                            </div>
                        </button>
                        <div class="landing-topbar-actions">

                            </button>

                                <span id="userAvatarLetter" class="user-avatar-letter">U</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="chat-default-view" id="chatDefaultView">
                    <div class="chat-default-scroll">
                        <section class="landing-shell" id="chatLandingHero">
                            <div class="landing-hero landing-hero--compact">
                                <div class="landing-hero-copy landing-hero-copy--centered">
                                    <h1 class="landing-hero-title">一句话，生成<span class="landing-hero-highlight">可上线</span>主题包</h1>
                                    <p class="landing-hero-subtitle">告别繁琐代码配置，通过自然语言即刻定制 OA 专属皮肤</p>
                                </div>
                            </div>

                            <div class="input-area input-area--landing">
                                <div class="image-preview-bar" id="imagePreviewBar"></div>
                                <div class="input-row chat-shell-composer">
                                    <div class="chat-input-wrapper chat-shell-composer-inner chat-shell-composer-inner--landing">
                                        <textarea id="messageInput" rows="1" placeholder="描述你要生成的主题包（节日+画面+场景＋风格 +色调）例如：做一个国庆节主题，一幅融合长城与故宫元素的庄重山河场景，以3D史诗风格呈现，整体采用红金渐变色调。"></textarea>
                                        <div class="chat-shell-toolbar">
                                            <button id="plusBtn" class="plus-btn ui-icon-button chat-shell-plus" title="添加图片">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                                </svg>
                                            </button>
<span class="chat-cost-hint" style="display: none;">✦25</span>
                                            <button id="sendBtn" class="ui-icon-button chat-shell-send" title="发送">
                                                <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M12 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                    <path d="M5 12L12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                                <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <section class="landing-section landing-section--after-composer" aria-labelledby="landingStartTitle">
                                <div class="landing-starter-pills theme-suggestions" data-tooltip="点击快捷指令，生图效果更佳" title="点击快捷指令，生图效果更佳">
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="想做一套有新年氛围的主题皮肤，整体轻盈喜庆，适合门户首页和工作台展示。">
                                        想做一套有新年氛围的主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="做一套春节主题皮肤，要有节日感和热闹气氛，适合标准产品首页展示。">
                                        做一套春节主题皮肤，要有节日感和热闹气氛
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="来一套春日气息的清明节主题皮肤">
                                        来一套春日气息的清明节主题皮肤
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="需要一套国风端午节主题包">
                                        需要一套国风端午节主题包
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="推行科技创新，做一套科技主题包">
                                        推行科技创新，做一套科技主题包
                                    </button>
                                    <button class="landing-starter-pill theme-btn landing-prompt-trigger" data-prompt="做一套温馨的中秋节主题">

                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/Cooperation-02.png" data-theme-name="协作办公" aria-label="用协作办公主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/Cooperation-02.png" alt="企业主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/Technology-03.png" data-theme-name="科技蓝" aria-label="用科技蓝主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/Technology-03.png" alt="科技蓝主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/Industry-04.png" data-theme-name="智能工厂" aria-label="用智能工厂主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/Industry-04.png" alt="科技工厂主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/WorkCabin-05.png" data-theme-name="工作舱" aria-label="用工作舱主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/WorkCabin-05.png" alt="办公工作台主题效果图" loading="lazy">
                                    </article>
                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/EnvironmentalProtection-06.png" data-theme-name="环保科技" aria-label="用环保科技主题图生成主题包" role="button" tabindex="0">
                                        <img class="landing-template-image" src="/workbench-gallery/EnvironmentalProtection-06.png" alt="环保科技主题效果图" loading="lazy">

                                    <article class="landing-gallery-card landing-template-card landing-gallery-trigger" data-image-src="/workbench-gallery/GreenIndustry-08.png" data-theme-name="绿色工业" aria-label="用绿色工业主题图生成主题包" role="button" tabindex="0">

                                        <img class="landing-template-image" src="/workbench-gallery/AdvancedTechnology-09.png" alt="先进科技主题效果图" loading="lazy">
                                    </article>

                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </button>
                                <span class="chat-cost-hint" style="display: none;">✦25</span>
                                <button id="conversationSendBtn" class="ui-icon-button chat-shell-send" title="发送">
                                    <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M5 12L12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>

        <!-- 打包选择弹窗 -->

            <div class="modal-content settings-modal">

                        <h2 class="settings-title">API设置</h2>
                        <p class="settings-subtitle">配置您的工作区 API 凭据和环境参数</p>

                    <button class="modal-close-btn" aria-label="关闭">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </header>

                <!-- Scrollable Body -->
                <div class="settings-body">
                    <!-- Section 1: Account -->
                    <section class="settings-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>账号设置</h3>
                        </div>
                        <div class="settings-card">
                            <div class="form-row">
                                <div class="form-label-group">
                                    <label class="form-label" for="accountSelector">当前账号</label>
                                    <span class="form-label-desc">可在三个测试账号之间快速切换</span>
                                </div>
                                <div class="form-input-wrap">
                                    <select id="accountSelector">
                                        <option value="customer-a">客户A</option>
                                        <option value="customer-b">客户B</option>
                                        <option value="customer-c">客户C</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Section 2: Interface Settings -->
                    <section class="settings-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>界面与常规设置</h3>
                        </div>
                        <div class="settings-card">
                            <div class="form-row">
                                <div class="form-label-group">
                                    <label class="form-label" for="uiThemeMode">界面模式</label>
                                    <span class="form-label-desc">选择您偏好的视觉主题</span>
                                </div>
                                <div class="form-input-wrap">

                </div>

                <!-- Footer -->

                    <span class="settings-help-link">获取配置帮助</span>
                    <div class="settings-footer-actions">
                        <button id="cancelSettings" class="btn-cancel">取消</button>
                        <button id="saveSettings" class="btn-save">保存</button>
                    </div>
                </footer>
            </div>
        </div>

        <script>
          function resizePreview() {
            var containers = document.querySelectorAll('.preview-content');
            containers.forEach(function(container) {
              var cw = container.clientWidth;
              var ch = container.clientHeight;
              if (cw === 0 || ch === 0) return;

              var activePage = container.querySelector('.preview-page.active-preview');
              if (!activePage) activePage = container.querySelector('.preview-page');
              if (!activePage) return;

              var rendered = activePage.firstElementChild;
              if (!rendered) return;

              var rw = rendered.offsetWidth || parseInt(rendered.style.width) || 0;
              var rh = rendered.offsetHeight || parseInt(rendered.style.height) || 0;
              if (rw === 0 || rh === 0) return;

              var scaleX = cw / rw;
              var scaleY = ch / rh;
              var scale = Math.max(scaleX, scaleY);

              var offsetX = (cw - rw * scale) / 2;
              var offsetY = (ch - rh * scale) / 2;

              rendered.style.transform = 'scale(' + scale + ') translate(' + (offsetX / scale) + 'px, ' + (offsetY / scale) + 'px)';
              rendered.style.transformOrigin = 'top left';
            });
          }

          window.addEventListener('resize', resizePreview);
          window.resizePreview = resizePreview;
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(resizePreview, 200);
            setTimeout(resizePreview, 1000);
            document.querySelectorAll('.preview-tabs button').forEach(function(btn) {
              btn.addEventListener('click', function() { setTimeout(resizePreview, 100); });
            });
          });
        </script>

        <script type="module" src="/src/main.ts"></script>
    </div> <!-- end workspaceView -->
