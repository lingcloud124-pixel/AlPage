<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Studio - 主题编辑器</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="stylesheet" href="/src/templates/theme-variables.css">
    <link rel="stylesheet" href="/src/tailwind.css">
</head>
<body>
    <!-- Removed homePage - app goes directly to workspace -->

    <div id="workspaceView">
        <div class="app-container">
            <!-- Column 1: Project Sidebar (collapsible) -->
            <aside class="project-sidebar" id="projectSidebar">
                <div class="sidebar-brand-header">
                    <div class="sidebar-brand-icon"></div>
                    <div class="sidebar-brand-info">
                        <div class="sidebar-brand-title">Theme Studio</div>
                        <div class="sidebar-brand-subtitle">AI 主题设计助手</div>
                    </div>
                </div>
                <div class="sidebar-new-btn" id="newProjectBtn">+ 新建项目</div>
                <div class="sidebar-project-list" id="sidebarProjectList">
                    <!-- JS fills this -->
                </div>
                <div class="sidebar-settings-btn" id="sidebarSettingsBtn">⚙ 设置</div>
            </aside>

            <!-- Column 2: Chat Panel -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <div class="brand-header">
                        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="展开/收起项目列表">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="6" x2="21" y2="6"/>
                                <line x1="3" y1="12" x2="21" y2="12"/>
                                <line x1="3" y1="18" x2="21" y2="18"/>
                            </svg>
                        </button>
                        <span class="chat-project-name" id="chatProjectName">未命名项目</span>
                    </div>
                    <button id="projectActionBtn" class="settings-btn" title="项目操作">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
                        </svg>
                    </button>
                    <div class="project-action-menu" id="projectActionMenu">
                        <button id="actionRename" class="plus-menu-item">重命名</button>
                        <button id="actionPin" class="plus-menu-item">置顶</button>
                        <button id="actionDelete" class="plus-menu-item">删除</button>
                    </div>
                </div>
                
                <div class="messages-container">
                    <!-- Welcome message with suggestions -->
                    <div class="message ai-message welcome-message">
                        <div class="avatar">
                            <svg class="robot-avatar" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="5" y="6" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
                                <circle cx="18" cy="7" r="1" fill="currentColor"/>
                                <circle cx="6" cy="7" r="1" fill="currentColor"/>
                                <rect x="9" y="10" width="6" height="2" rx="1" fill="currentColor"/>
                                <line x1="9" y1="15" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="message-content">
                            <h4 class="welcome-title">欢迎使用 Theme Studio</h4>
                            <p class="welcome-text">告诉我您需要什么场景的主题，例如 "做一套春节主题" 或 "端午节活动页"：</p>
                            <div class="theme-suggestions">
                                <button class="theme-btn">🧧 春节主题</button>
                                <button class="theme-btn">🐲 端午节主题</button>
                                <button class="theme-btn">🌙 中秋节主题</button>
                                <button class="theme-btn">🎊 国庆节主题</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="attachments-preview" id="attachmentsPreview"></div>
                
                <div class="input-area">
                    <div class="image-preview-bar" id="imagePreviewBar"></div>
                    <div class="input-row">
                        <div class="chat-input-wrapper">
                            <input type="text" id="messageInput" placeholder="描述您需要的活动/节日主题..." />
                            <button id="plusBtn" class="plus-btn" title="添加图片">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                            </button>
                        </div>
                        <button id="sendBtn" title="发送">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Column 3: Preview Panel (hidden by default, expands after AI generates theme) -->
            <div class="preview-panel" id="previewPanel">
                <!-- Close button -->
                <button class="preview-close-btn" id="previewCloseBtn" title="关闭预览">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <!-- Workspace Top Bar -->
                <div class="workspace-topbar">
                    <div class="topbar-left">
                        <span class="project-name" id="projectName">未命名项目</span>
                        <div class="topbar-tabs">
                            <button id="loginTab" class="tab-btn active-tab">登录页</button>
                            <button id="mainPageTab" class="tab-btn">主页</button>
                        </div>
                    </div>
                    <div class="topbar-right">
                        <div class="header-switcher" id="headerSwitcher" style="display:none;">
                            <span class="header-switcher-label">页眉：</span>
                            <select id="headerSelect">
                                <option value="header-default">默认</option>
                                <option value="header-simple">简洁</option>
                                <option value="header-classic">经典</option>
                                <option value="header-simple-multitab">简洁多标签</option>
                                <option value="header-complex">多页签</option>
                                <option value="header-menu">菜单</option>
                                <option value="header-banner">横幅</option>
                                <option value="header-v16-default">V16默认</option>
                                <option value="header-v16-search">V16搜索</option>
                            </select>
                        </div>
                        <button class="topbar-action-btn" id="panelToggleBtn">面板</button>
                        <button class="topbar-action-btn" id="packageBtn">打包</button>
                    </div>
                </div>
                
                <div class="preview-content">
                    <div id="loginPage" class="preview-page active-preview">
                    </div>
                    
                    <div id="mainPage" class="preview-page">
                    </div>
                </div>
            </div> <!-- end preview-panel -->

        </div> <!-- end app-container -->

        <!-- 右侧滑出面板 -->
        <div class="side-panel" id="sidePanel">
            <div class="side-panel-header">
                <h3>颜色配置</h3>
                <button class="side-panel-close" id="sidePanelClose">&times;</button>
            </div>
            <div class="side-panel-body" id="colorEditor"></div>
            
            <!-- 质检报告区域 -->
            <div class="qc-section" id="qcSection">
                <h3 class="qc-title">质检报告</h3>
                <button class="qc-run-btn" id="qcRunBtn">运行检查</button>
                <div id="qcResults" class="qc-results"></div>
            </div>
        </div>

        <!-- 打包选择弹窗 -->
        <div class="modal-overlay" id="packageModal">
            <div class="modal-content" style="width: 520px;">
                <div class="modal-header">
                    <h3>主题打包</h3>
                    <button class="modal-close-btn" id="packageModalClose">&times;</button>
                </div>
                <div class="modal-body">
                    <p style="margin-bottom: 16px; color: var(--auxiliary-gray);">选择需要打包的产品：</p>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                        <button id="packageSelectAll" style="padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 14px;">全选</button>
                        <button id="packageDeselectAll" style="padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 14px;">取消全选</button>
                    </div>
                    <div id="packageProductList" class="package-product-list">
                        <!-- 由 JS 动态生成 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="packageStartBtn" style="background-color: var(--primary-color); color: white;">开始打包</button>
                    <button id="packageCancelBtn">取消</button>
                </div>
            </div>
        </div>


        <!-- 设置模态框 -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>API设置</h3>
                    <button class="modal-close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-field">
                        <label for="apiEndpoint">API端点：</label>
                        <input type="text" id="apiEndpoint" placeholder="https://open.bigmodel.cn/api/paas/v4" />
                    </div>
                    <div class="form-field">
                        <label for="apiKey">API密钥：</label>
                        <input type="password" id="apiKey" placeholder="智谱 API Key" />
                    </div>
                    <div class="form-field">
                        <label for="modelName">模型名称：</label>
                        <input type="text" id="modelName" placeholder="GLM-4-Flash" />
                    </div>
                    <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:16px 0;">
                    <h4 style="margin:0 0 12px;color:rgba(255,255,255,0.7);font-size:13px;">图像生成模型 — MiniMax image-01（用于生成主题背景图）</h4>
                    <div class="form-field">
                        <label for="imageApiEndpoint">图像API端点：</label>
                        <input type="text" id="imageApiEndpoint" placeholder="https://api.minimaxi.com/v1" />
                    </div>
                    <div class="form-field">
                        <label for="imageApiKey">图像API密钥：</label>
                        <input type="password" id="imageApiKey" placeholder="MiniMax Token Plan API Key" />
                    </div>
                    <div class="form-field">
                        <label for="imageModelName">图像模型名称：</label>
                        <input type="text" id="imageModelName" placeholder="image-01" />
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="saveSettings">保存</button>
                    <button id="cancelSettings">取消</button>
                </div>
            </div>
        </div>

        <script>
          function resizePreview() {
            var containers = document.querySelectorAll('.preview-content');
            containers.forEach(function(container) {
              var cw = container.clientWidth;
              var ch = container.clientHeight;
              if (cw === 0 || ch === 0) return;

              var activePage = container.querySelector('.preview-page.active-preview');
              if (!activePage) activePage = container.querySelector('.preview-page');
              if (!activePage) return;

              var rendered = activePage.firstElementChild;
              if (!rendered) return;

              var rw = rendered.offsetWidth || parseInt(rendered.style.width) || 0;
              var rh = rendered.offsetHeight || parseInt(rendered.style.height) || 0;
              if (rw === 0 || rh === 0) return;

              var scaleX = cw / rw;
              var scaleY = ch / rh;
              var scale = Math.max(scaleX, scaleY);

              var offsetX = (cw - rw * scale) / 2;
              var offsetY = (ch - rh * scale) / 2;

              rendered.style.transform = 'scale(' + scale + ') translate(' + (offsetX / scale) + 'px, ' + (offsetY / scale) + 'px)';
              rendered.style.transformOrigin = 'top left';
            });
          }

          window.addEventListener('resize', resizePreview);
          window.resizePreview = resizePreview;
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(resizePreview, 200);
            setTimeout(resizePreview, 1000);
            document.querySelectorAll('.preview-tabs button').forEach(function(btn) {
              btn.addEventListener('click', function() { setTimeout(resizePreview, 100); });
            });
          });
        </script>

        <script type="module" src="/src/main.ts"></script>
    </div> <!-- end workspaceView -->
</body>
</html>
