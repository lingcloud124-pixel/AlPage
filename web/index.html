<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Studio - 主题编辑器</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="stylesheet" href="/src/templates/theme-variables.css">
    <link rel="stylesheet" href="/src/tailwind.css">
</head>
<body>
    <!-- Removed homePage - app goes directly to workspace -->

    <div id="workspaceView">
        <div class="app-container">
            <!-- Column 1: Project Sidebar (collapsible) -->
            <aside class="project-sidebar" id="projectSidebar">
                <div class="sidebar-brand-header">
                    <div class="sidebar-brand-icon"></div>
                    <div class="sidebar-brand-info">
                        <div class="sidebar-brand-title">Theme Studio</div>
                        <div class="sidebar-brand-subtitle">AI 主题设计助手</div>
                    </div>
                </div>
                <div class="sidebar-new-btn" id="newProjectBtn">+ 新建项目</div>
                <div class="sidebar-project-list" id="sidebarProjectList">
                    <!-- JS fills this -->
                </div>
                <button class="sidebar-settings-btn ui-icon-button ui-icon-button-inline" id="sidebarSettingsBtn" title="打开设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.64 0 1.22.26 1.64.68.42.42.68 1 .68 1.64s-.26 1.22-.68 1.64c-.42.42-1 .68-1.64.68h-.09A1.65 1.65 0 0 0 19.4 15z"></path>
                    </svg>
                    <span>设置</span>
                </button>
            </aside>
            <div class="pane-divider pane-divider-sidebar" id="sidebarDivider" aria-hidden="true"></div>

            <!-- Column 2: Chat Panel -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <div class="brand-header">
                        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="展开/收起项目列表">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="7 9 3 12 7 15"/>
                                <line x1="9" y1="7" x2="21" y2="7"/>
                                <line x1="9" y1="12" x2="21" y2="12"/>
                                <line x1="9" y1="17" x2="21" y2="17"/>
                            </svg>
                        </button>
                        <span class="chat-project-name" id="chatProjectName">未命名项目</span>
                    </div>
                    <button id="projectActionBtn" class="settings-btn" title="项目操作">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
                        </svg>
                    </button>
                    <div class="project-action-menu" id="projectActionMenu">
                        <button id="actionRename" class="plus-menu-item">重命名</button>
                        <button id="actionPin" class="plus-menu-item">置顶</button>
                        <button id="actionDelete" class="plus-menu-item">删除</button>
                    </div>
                </div>
                
                <div class="messages-container">
                    <!-- Welcome message with suggestions -->
                    <div class="message ai-message welcome-message">
                        <div class="avatar">
                            <svg class="robot-avatar" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="5" y="6" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
                                <circle cx="18" cy="7" r="1" fill="currentColor"/>
                                <circle cx="6" cy="7" r="1" fill="currentColor"/>
                                <rect x="9" y="10" width="6" height="2" rx="1" fill="currentColor"/>
                                <line x1="9" y1="15" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="message-content">
                            <h4 class="welcome-title">欢迎使用 Theme Studio</h4>
                            <p class="welcome-text">告诉我您需要什么场景的主题，例如 "做一套春节主题" 或 "端午节活动页"：</p>
                            <div class="theme-suggestions">
                                <button class="theme-btn">春节主题</button>
                                <button class="theme-btn">端午主题</button>
                                <button class="theme-btn">中秋主题</button>
                                <button class="theme-btn">国庆主题</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="attachments-preview chat-shell-attachments" id="attachmentsPreview"></div>
                
                <div class="input-area">
                    <div class="image-preview-bar" id="imagePreviewBar"></div>
                    <div class="input-row">
                        <div class="chat-input-wrapper">
                            <input type="text" id="messageInput" placeholder="描述您需要的活动/节日主题..." />
                            <button id="plusBtn" class="plus-btn ui-icon-button chat-shell-plus" title="添加图片">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                            </button>
                        </div>
                        <button id="sendBtn" class="ui-icon-button chat-shell-send" title="发送">
                            <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <rect x="4" y="4" width="16" height="16" rx="2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="pane-divider pane-divider-preview" id="previewDivider" aria-hidden="true"></div>

            <!-- Column 3: Preview Panel (hidden by default, expands after AI generates theme) -->
            <div class="preview-panel" id="previewPanel">
                <!-- Close button -->
                <button class="preview-close-btn" id="previewCloseBtn" title="关闭预览">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <!-- Workspace Top Bar -->
                <div class="workspace-topbar">
                    <div class="topbar-left">
                        <span class="project-name" id="projectName">未命名项目</span>
                        <div class="topbar-tabs">
                            <div class="tab-indicator"></div>
                            <button id="loginTab" class="tab-btn active-tab">登录页</button>
                            <button id="mainPageTab" class="tab-btn">主页</button>
                        </div>
                    </div>
                    <div class="topbar-right">
                        <button class="topbar-action-btn" id="panelToggleBtn">面板</button>
                        <button class="topbar-action-btn" id="packageBtn">打包</button>
                    </div>
                </div>
                
                <div class="preview-content">
                    <div id="loginPage" class="preview-page active-preview">
                    </div>
                    
                    <div id="mainPage" class="preview-page">
                    </div>
                </div>
            </div> <!-- end preview-panel -->

        </div> <!-- end app-container -->

        <!-- 右侧滑出面板 -->
        <div class="side-panel" id="sidePanel">
            <div class="side-panel-header">
                <h3>颜色配置</h3>
                <button class="side-panel-close" id="sidePanelClose">&times;</button>
            </div>
            <div class="side-panel-body" id="colorEditor"></div>
            
            <!-- 质检报告区域 -->
            <div class="qc-section" id="qcSection">
                <h3 class="qc-title">质检报告</h3>
                <button class="qc-run-btn" id="qcRunBtn">运行检查</button>
                <div id="qcResults" class="qc-results"></div>
            </div>
        </div>

        <!-- 打包选择弹窗 -->
        <div class="modal-overlay" id="packageModal">
            <div class="modal-content package-modal">
                <header class="package-modal-header">
                    <div>
                        <h2 class="package-modal-title">主题打包</h2>
                        <p class="package-modal-subtitle">选择需要打包的产品并执行打包任务</p>
                    </div>
                    <button class="package-modal-close-btn" id="packageModalClose" aria-label="关闭">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </header>
                <div class="package-modal-body">
                    <section class="package-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>产品选择</h3>
                        </div>
                        <div class="package-actions">
                            <button id="packageSelectAll">全选</button>
                            <button id="packageDeselectAll">取消全选</button>
                        </div>
                        <div id="packageProductList" class="package-product-list"></div>
                    </section>
                    <section class="package-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>最近导出批次</h3>
                        </div>
                        <div id="packageExportHistory" class="package-export-history">
                            <div class="export-history-empty">暂无导出记录</div>
                        </div>
                    </section>
                </div>
                <footer class="package-modal-footer">
                    <button id="packageStartBtn" class="btn-primary">开始打包</button>
                    <button id="packageCancelBtn" class="btn-secondary">取消</button>
                </footer>
            </div>
        </div>


        <!-- 设置模态框 -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content settings-modal">
                <!-- Header -->
                <header class="settings-header">
                    <div>
                        <h2 class="settings-title">API设置</h2>
                        <p class="settings-subtitle">配置您的工作区 API 凭据和环境参数</p>
                    </div>
                    <button class="modal-close-btn" aria-label="关闭">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </header>

                <!-- Scrollable Body -->
                <div class="settings-body">
                    <!-- Section 1: Chat Model -->
                    <section class="settings-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>对话模型 (Chat Model)</h3>
                        </div>
                        <div class="settings-card">
                            <div class="form-row">
                                <label class="form-label" for="apiEndpoint">API端点</label>
                                <div class="form-input-wrap">
                                    <input type="text" id="apiEndpoint" placeholder="coding.dashscope.aliyuncs.com/v1（留空使用默认代理）" />
                                </div>
                            </div>
                            <div class="form-row">
                                <label class="form-label" for="apiKey">API密钥</label>
                                <div class="form-input-wrap">
                                    <input type="password" id="apiKey" placeholder="DashScope API Key（留空使用默认）" />
                                </div>
                            </div>
                            <div class="form-row">
                                <label class="form-label" for="modelName">模型名称</label>
                                <div class="form-input-wrap">
                                    <input type="text" id="modelName" placeholder="qwen3.6-plus（留空使用默认）" />
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Section 2: Image Generation Model -->
                    <section class="settings-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>图像生成模型</h3>
                        </div>
                        <div class="settings-card">
                            <div class="form-row">
                                <label class="form-label" for="imageApiEndpoint">API端点</label>
                                <div class="form-input-wrap">
                                    <input type="text" id="imageApiEndpoint" placeholder="https://api.minimaxi.com/v1" />
                                </div>
                            </div>
                            <div class="form-row">
                                <label class="form-label" for="imageApiKey">API密钥</label>
                                <div class="form-input-wrap">
                                    <input type="password" id="imageApiKey" placeholder="MiniMax Token Plan API Key" />
                                </div>
                            </div>
                            <div class="form-row">
                                <label class="form-label" for="imageModelName">图像模型名称</label>
                                <div class="form-input-wrap">
                                    <input type="text" id="imageModelName" placeholder="image-01" />
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Section 3: Export Settings -->
                    <section class="settings-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>导出设置</h3>
                        </div>
                        <div class="settings-card">
                            <div class="form-row">
                                <label class="form-label" for="exportRoot">导出根目录</label>
                                <div class="form-input-wrap">
                                    <input type="text" id="exportRoot" placeholder="例如：/Users/你的名字/Documents/Theme Studio" />
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Section 4: Interface Settings -->
                    <section class="settings-section">
                        <div class="section-heading">
                            <span class="section-accent"></span>
                            <h3>界面与常规设置</h3>
                        </div>
                        <div class="settings-card">
                            <div class="form-row">
                                <div class="form-label-group">
                                    <label class="form-label" for="uiThemeMode">界面模式</label>
                                    <span class="form-label-desc">选择您偏好的视觉主题</span>
                                </div>
                                <div class="form-input-wrap">
                                    <select id="uiThemeMode">
                                        <option value="dark">Dark</option>
                                        <option value="light">Light</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Footer -->
                <footer class="settings-footer">
                    <span class="settings-help-link">获取配置帮助</span>
                    <div class="settings-footer-actions">
                        <button id="cancelSettings" class="btn-cancel">取消</button>
                        <button id="saveSettings" class="btn-save">保存</button>
                    </div>
                </footer>
            </div>
        </div>

        <script>
          function resizePreview() {
            var containers = document.querySelectorAll('.preview-content');
            containers.forEach(function(container) {
              var cw = container.clientWidth;
              var ch = container.clientHeight;
              if (cw === 0 || ch === 0) return;

              var activePage = container.querySelector('.preview-page.active-preview');
              if (!activePage) activePage = container.querySelector('.preview-page');
              if (!activePage) return;

              var rendered = activePage.firstElementChild;
              if (!rendered) return;

              var rw = rendered.offsetWidth || parseInt(rendered.style.width) || 0;
              var rh = rendered.offsetHeight || parseInt(rendered.style.height) || 0;
              if (rw === 0 || rh === 0) return;

              var scaleX = cw / rw;
              var scaleY = ch / rh;
              var scale = Math.max(scaleX, scaleY);

              var offsetX = (cw - rw * scale) / 2;
              var offsetY = (ch - rh * scale) / 2;

              rendered.style.transform = 'scale(' + scale + ') translate(' + (offsetX / scale) + 'px, ' + (offsetY / scale) + 'px)';
              rendered.style.transformOrigin = 'top left';
            });
          }

          window.addEventListener('resize', resizePreview);
          window.resizePreview = resizePreview;
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(resizePreview, 200);
            setTimeout(resizePreview, 1000);
            document.querySelectorAll('.preview-tabs button').forEach(function(btn) {
              btn.addEventListener('click', function() { setTimeout(resizePreview, 100); });
            });
          });
        </script>

        <script type="module" src="/src/main.ts"></script>
    </div> <!-- end workspaceView -->
</body>
</html>
