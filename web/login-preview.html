<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页预览</title>
    <link rel="stylesheet" href="/src/templates/theme-variables.css">
    <link rel="stylesheet" href="/src/templates/login.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        /* 模拟一个背景图让预览更直观 */
        :root {
            --theme-login-bg-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=2400&q=80');
        }
    </style>
</head>
<body>
    <div class="template-login">
        <div class="login-bg" style="background-image: var(--theme-login-bg-image);"></div>

        <div class="login-logo">
            <svg width="245" height="32" viewBox="0 0 245 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M122.5 2L142 12v8l-19.5 10L103 20v-8L122.5 2z M82.5 2L102 12v8L82.5 30L63 20v-8L82.5 2z M162.5 2L182 12v8L162.5 30L143 20v-8L162.5 2z M202.5 2L222 12v8L202.5 30L183 20v-8L202.5 2z M42.5 2L62 12v8L42.5 30L23 20v-8L42.5 2z" fill="var(--primary-color)" opacity="0.9"/>
            </svg>
        </div>

        <div class="login-panel-wrapper">
            <div class="login-topbar">
                <div class="login-lang-trigger">
                    <span>简体中文</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 10l5 5 5-5H7z"/>
                    </svg>
                </div>
            </div>

            <div class="login-module">
                <div class="login-wrap">
                    <div class="login-logo-center">
                        <svg width="196" height="30" viewBox="0 0 196 30" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 2L25 8v14L15 28L5 22V8L15 2z M45 2L55 8v14L45 28L35 22V8L45 2z M75 2L85 8v14L75 28L65 22V8L75 2z M105 2L115 8v14L105 28L95 22V8L105 2z M135 2L145 8v14L135 28L125 22V8L135 2z M165 2L175 8v14L165 28L155 22V8L165 2z" fill="var(--primary-color)" opacity="0.85"/>
                        </svg>
                    </div>

                    <div class="login-header">欢迎登录EKP平台</div>

                    <div class="login-tabs">
                        <button class="login-tab active">密码登录</button>
                        <button class="login-tab">短信登录</button>
                        <button class="login-tab">扫码登录</button>
                        <div class="login-tab-line"></div>
                        <div class="login-tab-indicator"></div>
                    </div>

                    <div class="login-input-group">
                        <input type="text" class="login-input" placeholder="用户名">
                        <svg class="login-eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="var(--auxiliary-gray)">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </div>

                    <div class="login-input-group">
                        <input type="password" class="login-input" placeholder="密码">
                        <svg class="login-eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="var(--auxiliary-gray)">
                            <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.45C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </div>

                    <div class="login-captcha-row">
                        <input type="text" class="login-input login-captcha-input" placeholder="验证码" maxlength="4">
                        <div class="login-captcha-img">验证码</div>
                    </div>

                    <button class="login-submit-btn">登 录</button>

                    <a class="login-forgot" href="#">忘记密码</a>
                </div>
            </div>

            <div class="login-copyright">
                <p>©2001-2025 深圳市蓝凌软件股份有限公司 版权所有</p>
            </div>
        </div>
    </div>
</body>
</html>
