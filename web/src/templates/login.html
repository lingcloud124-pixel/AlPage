<div class="template-login">
  <div class="login-container">
    <div class="login-left"></div>
    
    <div class="login-right">
      <div class="login-panel">
        <div class="company-logo">
          <svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <polygon points="30,5 50,18 50,42 30,55 10,42 10,18" fill="var(--primary-color)" />
          </svg>
        </div>
        
        <h1 class="login-title">智慧办公平台</h1>
        
        <div class="login-subtitle">Landray EKP</div>
        
        <form class="login-form">
          <div class="input-group">
            <label for="username">用户名</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" id="username" name="username" placeholder="请输入用户名">
            </div>
          </div>
          
          <div class="input-group">
            <label for="password">密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" name="password" placeholder="请输入密码">
            </div>
          </div>
          
          <div class="captcha-row">
            <div class="input-group captcha-group">
              <label for="captcha">验证码</label>
              <div class="input-wrapper">
                <input type="text" id="captcha" name="captcha" placeholder="请输入验证码" maxlength="4">
              </div>
            </div>
            
            <div class="captcha-image">
              <div class="captcha-placeholder">验证码</div>
            </div>
          </div>
          
          <button type="submit" class="login-btn">登 录</button>
        </form>
        
        <div class="language-switch">
          中文 | English
        </div>
      </div>
    </div>
  </div>
</div>
