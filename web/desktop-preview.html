<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面工作台预览</title>
    <link rel="stylesheet" href="/src/templates/theme-variables.css">
    <link rel="stylesheet" href="/src/templates/desktop.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div class="template-desktop">
        <div class="desktop-wrapper">
            <header class="desktop-header">
                <div class="header-logo">
                    <svg class="logo-mark" viewBox="0 0 32 32" width="28" height="28">
                        <rect width="32" height="32" rx="4" fill="var(--primary-color)"/>
                        <path d="M8 10h16v2H8zm0 5h12v2H8zm0 5h14v2H8z" fill="rgba(255,255,255,0.9)"/>
                    </svg>
                </div>
                <nav class="header-nav">
                    <a href="#" class="nav-link active">首页</a>
                    <a href="#" class="nav-link">协作</a>
                    <a href="#" class="nav-link">知识</a>
                    <a href="#" class="nav-link">流程</a>
                    <a href="#" class="nav-link">应用</a>
                </nav>
                <div class="header-actions">
                    <div class="header-search">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" opacity="0.5"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
                        <input type="text" class="search-input" placeholder="搜索"/>
                    </div>
                    <div class="header-divider"></div>
                    <button class="header-icon-btn" title="消息提醒">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </button>
                    <button class="header-icon-btn" title="企业">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/><path d="M9 9h1M9 13h1M9 17h1"/></svg>
                    </button>
                    <div class="header-divider"></div>
                    <button class="header-icon-btn" title="文件">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    </button>
                    <button class="header-icon-btn" title="退出">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                    <div class="header-avatar" title="管理员">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                </div>
            </header>
            <div class="desktop-body">
                <aside class="desktop-sidebar">
                    <div class="sidebar-header-img"></div>
                    <div class="sidebar-section">
                        <div class="sidebar-group-title">
                            <span>快捷导航</span>
                            <svg class="collapse-icon" width="10" height="6" viewBox="0 0 10 6" fill="currentColor"><path d="M0 0l5 6 5-6z"/></svg>
                        </div>
                        <nav class="sidebar-nav">
                            <a href="#" class="sidebar-item">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                                <span>工作台</span>
                            </a>
                            <a href="#" class="sidebar-item active">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
                                <span>待办事务</span>
                            </a>
                            <a href="#" class="sidebar-item">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                                <span>日程安排</span>
                            </a>
                            <a href="#" class="sidebar-item">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                <span>消息中心</span>
                            </a>
                            <a href="#" class="sidebar-item">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                                <span>通讯录</span>
                            </a>
                            <a href="#" class="sidebar-item">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span>知识文档</span>
                            </a>
                        </nav>
                    </div>
                    <div class="sidebar-section">
                        <div class="sidebar-group-title">
                            <span>流程管理</span>
                            <svg class="collapse-icon collapsed" width="10" height="6" viewBox="0 0 10 6" fill="currentColor"><path d="M0 0l5 6 5-6z"/></svg>
                        </div>
                        <nav class="sidebar-nav">
                            <a href="#" class="sidebar-item">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
                                <span>发起流程</span>
                            </a>
                            <a href="#" class="sidebar-item">
                                <svg class="sidebar-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                                <span>我的流程</span>
                            </a>
                        </nav>
                    </div>
                </aside>
                <main class="desktop-content"></main>
            </div>
        </div>
    </div>
</body>
</html>
