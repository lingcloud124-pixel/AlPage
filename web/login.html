<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Studio - 登录</title>
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/tailwind.css">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--app-bg);
      padding: 20px;
    }
    
    .login-card {
      background: var(--surface-1);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.3);
    }
    
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .login-brand-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .login-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      text-align: center;
    }
    
    .login-user-btn {
      background: #252540;
      border: 1px solid #3a3a5c;
      border-radius: 12px;
      padding: 16px 24px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    
    .login-user-btn:hover {
      border-color: var(--primary-color, #4A90D9);
      background: #2a2a48;
    }
    
    .login-user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-color, #4A90D9);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }
    
    .login-user-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
    }
    
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-title">Theme Studio</div>
      </div>
      
      <h2 class="login-title">选择用户登录</h2>
      
      <button class="login-user-btn" data-user="customer-a">
        <span class="login-user-avatar">A</span>
        <span class="login-user-name">客户A</span>
      </button>
      
      <button class="login-user-btn" data-user="customer-b">
        <span class="login-user-avatar">B</span>
        <span class="login-user-name">客户B</span>
      </button>
      
      <button class="login-user-btn" data-user="customer-c">
        <span class="login-user-avatar">C</span>
        <span class="login-user-name">客户C</span>
      </button>
      
      <div class="login-footer">
        Theme Automation System
      </div>
    </div>
  </div>

  <script type="module">
    import { fetchUsers, setUser } from './src/auth.js';

    async function hydrateUserButtons() {
      const users = await fetchUsers();
      const buttons = Array.from(document.querySelectorAll('.login-user-btn'));
      buttons.forEach((button, index) => {
        const user = users[index];
        if (!user) return;
        button.dataset.userId = String(user.id);
        button.dataset.userName = user.name;
        const avatar = button.querySelector('.login-user-avatar');
        const name = button.querySelector('.login-user-name');
        if (avatar) avatar.textContent = user.display_name.slice(0, 1).toUpperCase();
        if (name) name.textContent = user.display_name;
      });
      return users;
    }

    function checkAuthAndRedirect() {
      const stored = localStorage.getItem('theme-studio-user');
      if (stored) {
        window.location.href = '/index.html';
      }
    }

    async function handleLoginClick(event) {
      const button = event.target.closest('.login-user-btn');
      if (!button) return;

      const userId = button.dataset.userId;
      const userName = button.dataset.userName;
      const displayName = button.querySelector('.login-user-name')?.textContent;
      if (!userId || !userName || !displayName) return;

      try {
        const buttons = document.querySelectorAll('.login-user-btn');
        buttons.forEach(btn => {
          btn.disabled = true;
          btn.style.opacity = '0.7';
        });

        setUser({
          id: Number(userId),
          name: userName,
          display_name: displayName,
        });
        window.location.href = '/index.html';
      } catch (error) {
        console.error('Login failed:', error);
        alert('登录失败，请重试');
        const buttons = document.querySelectorAll('.login-user-btn');
        buttons.forEach(btn => {
          btn.disabled = false;
          btn.style.opacity = '1';
        });
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      checkAuthAndRedirect();
      try {
        await hydrateUserButtons();
      } catch (error) {
        console.error('Load users failed:', error);
      }
      document.addEventListener('click', handleLoginClick);
    });
  </script>
</body>
</html>
