<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1680" viewBox="0 0 2200 1680">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 18; ry: 18; }
      .agent { fill: #eef6ff; stroke: #93c5fd; stroke-width: 2; rx: 18; ry: 18; }
      .prompt { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 18; ry: 18; }
      .tools { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; rx: 18; ry: 18; }
      .theme { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2; rx: 18; ry: 18; }
      .apply { fill: #ecfeff; stroke: #67e8f9; stroke-width: 2; rx: 18; ry: 18; }
      .warn { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; rx: 18; ry: 18; }
      .arrow { stroke: #6b7280; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 10 10; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2200" height="1680" fill="#f8fafc"/>

  <text x="70" y="70" class="title">Theme Color Flow: 为什么端午节最后会变成红色</text>
  <text x="70" y="105" class="subtitle">可直接在浏览器中打开此 SVG 并缩放查看。路径: docs/diagrams/theme-color-flow.svg</text>

  <rect x="60" y="140" width="520" height="290" class="panel"/>
  <text x="90" y="185" class="label">1. 用户输入</text>
  <text x="90" y="225" class="body">例: “需要一套国风端午节主题包”</text>
  <text x="90" y="265" class="body">这里还没有真正决定主色。</text>
  <text x="90" y="305" class="body">系统会先尝试从文本里推颜色方向，</text>
  <text x="90" y="335" class="body">比如 red / green / blue。</text>

  <rect x="660" y="140" width="640" height="360" class="agent"/>
  <text x="690" y="185" class="label">2. web/src/agent/</text>
  <text x="690" y="225" class="body">tool-call-utils.ts</text>
  <text x="690" y="255" class="small">inferPrimaryHintFromText() → 调用 resolvePreferredHueHint()</text>
  <text x="690" y="295" class="body">knowledge-base.ts</text>
  <text x="690" y="325" class="small">端午预设是绿色:</text>
  <text x="690" y="355" class="small">dragon-boat = #2E7D32</text>
  <text x="690" y="385" class="small">dragon-boat-fresh = #4CAF50</text>
  <text x="690" y="435" class="body">问题点:</text>
  <text x="820" y="435" class="small">这套“端午应偏绿”的知识没有直接强制传成 primaryHint=green</text>

  <rect x="1380" y="140" width="720" height="360" class="theme"/>
  <text x="1410" y="185" class="label">3. web/src/theme/color-utils.ts</text>
  <text x="1410" y="225" class="body">resolvePreferredHueHint()</text>
  <text x="1410" y="265" class="small">只识别显式颜色词:</text>
  <text x="1410" y="295" class="small">red / 红 / 红色 / green / 绿 / 青绿 / blue / 蓝 ...</text>
  <text x="1410" y="345" class="body">结论:</text>
  <text x="1510" y="345" class="small">“端午”本身不会自动映射成 green</text>
  <text x="1410" y="385" class="small">如果用户没说“绿色”“青绿”，这里就拿不到 primaryHint=green</text>

  <rect x="660" y="580" width="640" height="330" class="prompt"/>
  <text x="690" y="625" class="label">4. web/src/landing-prompts.ts</text>
  <text x="690" y="665" class="body">端午默认 prompt 里包含:</text>
  <text x="690" y="705" class="small">深蓝 / 淡绿 / 金色 / 红色印章</text>
  <text x="690" y="755" class="body">这意味着给图像模型的不是“纯绿端午”，</text>
  <text x="690" y="785" class="body">而是“蓝绿金 + 一点红”的复合节日画面。</text>
  <text x="690" y="835" class="small">当红色印章、节庆文字或局部高对比元素较醒目时，</text>
  <text x="690" y="865" class="small">后续抽色可能会把红色抓成强候选。</text>

  <rect x="1380" y="580" width="720" height="440" class="tools"/>
  <text x="1410" y="625" class="label">5. web/src/tools/</text>
  <text x="1410" y="665" class="body">theme-intent-parser.ts</text>
  <text x="1410" y="695" class="small">能识别端午属于 festival / dragon-boat</text>
  <text x="1410" y="745" class="body">executor.ts</text>
  <text x="1410" y="775" class="small">generate_theme_pipeline → 生成图片</text>
  <text x="1410" y="805" class="small">analyzeImageAsync() → 提取 dominantColors</text>
  <text x="1410" y="835" class="small">pickBestThemeCandidate() → 从候选色里选主色</text>
  <text x="1410" y="885" class="body">关键判断:</text>
  <text x="1540" y="885" class="small">如果没有 primaryHint=green 强约束，</text>
  <text x="1410" y="915" class="small">最终主色主要由“生成图里哪种颜色最显眼”决定。</text>
  <text x="1410" y="965" class="small">所以图里如果红色比绿色更抢眼，</text>
  <text x="1410" y="995" class="small">结果就会落成红色主题。</text>

  <rect x="60" y="1030" width="720" height="260" class="theme"/>
  <text x="90" y="1075" class="label">6. web/src/theme/enterprise-primary-*.ts</text>
  <text x="90" y="1115" class="body">enterprise-primary-palette.ts</text>
  <text x="90" y="1145" class="small">企业安全色库</text>
  <text x="90" y="1185" class="body">enterprise-primary-mapper.ts</text>
  <text x="90" y="1215" class="small">企业语义映射 + 绿色吸附到企业安全绿</text>
  <text x="90" y="1265" class="small">但这层主要处理“企业语义”或“绿色候选修正”，</text>
  <text x="90" y="1295" class="small">不会自动把“端午”强行理解成绿色。</text>

  <rect x="860" y="1080" width="560" height="210" class="apply"/>
  <text x="890" y="1125" class="label">7. web/src/theme-engine.ts</text>
  <text x="890" y="1165" class="body">把最终选出来的主色写成 CSS 变量</text>
  <text x="890" y="1195" class="small">--primary-color / --primary-color-hover ...</text>
  <text x="890" y="1245" class="small">然后保存到项目状态，页面预览和导出都消费这套变量。</text>

  <rect x="1500" y="1080" width="600" height="210" class="apply"/>
  <text x="1530" y="1125" class="label">8. web/src/templates/</text>
  <text x="1530" y="1165" class="body">login.css / desktop.css / header*.css / sidebar.css</text>
  <text x="1530" y="1195" class="small">使用 var(--primary-color)</text>
  <text x="1530" y="1245" class="small">所以一旦主色被选成红色，整个预览就都会呈现红色主题。</text>

  <rect x="60" y="1370" width="2040" height="240" class="warn"/>
  <text x="90" y="1415" class="label">最终结论</text>
  <text x="90" y="1460" class="body">端午节变红，不是因为系统“认为端午应该是红色”。</text>
  <text x="90" y="1495" class="body">而是因为: 端午预设绿没有接到 primaryHint 强约束链路；端午默认 prompt 里又带了红色印章；</text>
  <text x="90" y="1530" class="body">最后 executor 主要按生成图抽色选主色，所以红色一旦更显眼，就会被选成最终主题色。</text>
  <text x="90" y="1575" class="small">如果要修，最直接的两刀是: 1) 端午/龙舟/粽子 自动推 green；2) 端午 prompt 去掉红色印章，改成墨绿或青金。</text>

  <path d="M580 285 L660 285" class="arrow"/>
  <path d="M1300 285 L1380 285" class="arrow"/>
  <path d="M980 500 L980 580" class="arrow"/>
  <path d="M1300 745 L1380 745" class="arrow"/>
  <path d="M1740 1020 L1740 1080" class="arrow"/>
  <path d="M780 1165 L860 1165" class="arrow"/>
  <path d="M1420 1185 L1500 1185" class="arrow"/>
  <path d="M1700 500 L1700 580" class="arrow dashed"/>
</svg>
