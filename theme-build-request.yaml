# =============================================================================
# Theme Build Request Configuration
# =============================================================================
# 主题包构建请求配置文件
#
# 使用方法:
#   python3 theme_builder.py --config theme-build-request.yaml
#   python3 theme_builder.py --config theme-build-request.yaml --output ./output
#
# 图片路径说明:
#   - 相对路径: 相对于本配置文件所在目录
#   - 绝对路径: 直接写完整路径
#   - 留空: 使用模板默认图片
# =============================================================================

# --------------------------------------------------------------------------
# 基本信息
# --------------------------------------------------------------------------
# 可选：英文标识符；不填时 theme_builder.py 会根据 title 自动推导
# nameEn: "national-day"
title: "2026国庆节"
subtitle: "庆祝新中国成立77周年"
buttonText: "立即进入"

# --------------------------------------------------------------------------
# 主题色（hex格式，会替换CSS中的所有颜色变体）
# --------------------------------------------------------------------------
themeColor: "#C91D23"

# --------------------------------------------------------------------------
# 图片资源（所有路径相对于本配置文件目录）
# --------------------------------------------------------------------------
images:

  # ======================
  # MK 专有（6张头部图片）
  # ======================
  # 这6张图片对应MK主题包中 static/ 目录下的6个头部图片位置
  # 6张图片分别用于不同的页眉样式：
  #   headerBanner     - Banner样式页眉（全宽banner）
  #   headerClassic    - 经典样式页眉
  #   headerSimple     - 简洁样式页眉
  #   headerTabs       - 标签页样式页眉
  #   headerIcon      - 图标样式页眉
  #   headerSideheader - 侧边栏样式页眉
  #
  # 如果只提供1张图片，则6个位置都使用同一张图片
  # 如不需要某张图片，留空即可
  headerBanner:     "images/header-banner.png"
  headerClassic:    "images/header-classic.png"
  headerSimple:     "images/header-simple.png"
  headerTabs:       "images/header-tabs.png"
  headerIcon:       "images/header-icon.png"
  headerSideheader: "images/header-sideheader.png"

  # ======================
  # 登录页图片
  # ======================
  # 登录页背景图（MK和EKP通用）
  loginBackground: "images/login-bg.png"
  # 登录页Logo（MK和EKP通用）
  loginLogo:       "images/logo.png"

# --------------------------------------------------------------------------
# 要生成的产品包
# --------------------------------------------------------------------------
# 支持的产品:
#   mk       - MK 新版（现代主题）
#   ekp_v14  - EKP v14
#   ekp_v15  - EKP v15
#   ekp_v16  - EKP v16
#   ekp_v17  - EKP v17（最新传统版）
#
# 取消注释要生成的产品，注释掉的不生成
# --------------------------------------------------------------------------
products:
  - mk
  - ekp_v14
  - ekp_v15
  - ekp_v16
  - ekp_v17

# --------------------------------------------------------------------------
# 输出目录（可选，不填则输出到本配置文件所在目录的 output/ 子目录）
# --------------------------------------------------------------------------
# outputDir: "/Users/gulingfei/Desktop/APP（vibe-coding）/Topic Automation/output"
