apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: theme-studio-ingress
  namespace: theme-studio
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/websocket-services: "theme-studio-svc"
spec:
  ingressClassName: nginx
  rules:
    - host: theme-studio.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: theme-studio-svc
                port:
                  number: 3001
